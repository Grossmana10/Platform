  <style>

t:space-between;margin-bottom:16px}.right-head h2{font-size:16px;margin:0}.count{color:var(--muted);font-size:12px}.comment{padding:14px 10px;border-top:1px solid var(--line);cursor:pointer}.comment:hover{background:#141920}.comment-head{display:flex;align-items:center;gap:8px}.avatar{width:27px;height:27px;border-radius:50%;display:grid;place-items:center;background:#324563;color:#dce9ff;font-size:11px;font-weight:800}.avatar.alt{background:#5b3c24;color:#ffe5ca}.comment .stamp{color:var(--blue);font-variant-numeric:tabular-nums;font-size:12px;font-weight:750}.comment p{margin:8px 0 5px;color:#dae0e6}.comment small{color:var(--muted)}.composer{position:sticky;bottom:0;background:#0d1014;padding:14px 2px 4px}.composer input{width:100%;border:1px solid #343d48;background:#141920;color:var(--text);padding:12px;border-radius:8px;outline:none}.composer input:focus{border-color:var(--acid)}.notice{display:none;margin-top:10px;color:var(--acid);font-size:12px}@media(max-width:900px){body{overflow:auto}.app{height:auto;min-height:100vh}.layout{grid-template-columns:1fr}.side{display:none}.side.right{display:block;border-left:0;border-top:1px solid var(--line)}.main{padding:20px 16px}.wave{height:210px}.crumb{display:none}.quality{display:none}.top{padding:0 12px}.btn.hide-mobile{display:none}}
    /* Ambient indigo palette */
    :root{--bg:#090817;--panel:#111026;--panel2:#191735;--line:#302e55;--muted:#9695b5;--text:#f3f1ff;--acid:#a7b5ff;--blue:#8f9fff;--orange:#c184ff}
    body{background:radial-gradient(circle at 48% -20%,#2b2266 0,transparent 40%),linear-gradient(135deg,#090817,#0d0a22 62%,#12102d)}
